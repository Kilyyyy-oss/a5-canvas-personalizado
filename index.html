<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>A5 | Figuras en Canvas</title>
<style>
body{margin:0;background:#f7f4ee;font-family:Arial,sans-serif;color:#3f4750;text-align:center}h1{font-size:25px;margin:26px 10px 6px}p{margin:0 12px 20px;font-size:14px}canvas{background:#fffdf9;border:2px solid #d8d2c7;border-radius:12px;max-width:94vw;height:auto;box-shadow:0 5px 15px #0000000b}footer{font-size:12px;margin:15px;color:#777}
</style>
</head>
<body><h1>Mis dibujos en Canvas</h1><p>Figuras hechas con líneas, círculos, curvas y gradientes.</p><canvas id="lienzo" width="840" height="570"></canvas><footer>A5 · Dibujo de figuras</footer>
<script>
const c=document.getElementById('lienzo');const ctx=c.getContext('2d');
function linea(x1,y1,x2,y2,color='#4a4a4a',grosor=3){ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.strokeStyle=color;ctx.lineWidth=grosor;ctx.stroke();}
function circulo(x,y,r,color){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle=color;ctx.fill();}
function etiqueta(t,x,y){ctx.font='bold 16px Arial';ctx.textAlign='center';ctx.fillStyle='#62666b';ctx.fillText(t,x,y);}
// Casita pequeña con chimenea y techo azul.
ctx.fillStyle='#f3d9a4';ctx.fillRect(87,125,150,113);
ctx.beginPath();ctx.moveTo(68,127);ctx.lineTo(162,55);ctx.lineTo(256,127);ctx.closePath();ctx.fillStyle='#7294ad';ctx.fill();
ctx.fillStyle='#9b7460';ctx.fillRect(200,65,20,37);
ctx.fillStyle='#fff7e9';ctx.fillRect(110,151,35,35);ctx.strokeStyle='#8d6f58';ctx.lineWidth=2;ctx.strokeRect(110,151,35,35);
linea(127.5,151,127.5,186,'#8d6f58',2);linea(110,168.5,145,168.5,'#8d6f58',2);
ctx.fillStyle='#bd806b';ctx.fillRect(175,171,38,67);circulo(205,207,3,'#f5e7c4');etiqueta('Casita',162,274);
// Honguito de sombrero morado con lunares y tallo.
ctx.fillStyle='#e9d9bc';ctx.beginPath();ctx.roundRect(375,162,62,78,18);ctx.fill();
ctx.beginPath();ctx.moveTo(345,169);ctx.quadraticCurveTo(359,70,406,83);ctx.quadraticCurveTo(458,78,470,169);ctx.closePath();
const h=ctx.createLinearGradient(350,95,455,185);h.addColorStop(0,'#c6a3df');h.addColorStop(1,'#7757a0');ctx.fillStyle=h;ctx.fill();
circulo(391,114,11,'#f8ebf7');circulo(432,133,9,'#f8ebf7');circulo(370,148,7,'#f8ebf7');
circulo(392,196,3,'#4d3f48');circulo(420,196,3,'#4d3f48');ctx.beginPath();ctx.arc(406,204,7,0,Math.PI);ctx.strokeStyle='#4d3f48';ctx.lineWidth=2;ctx.stroke();etiqueta('Honguito',406,274);
// Estrella naranja de cinco puntas.
ctx.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5;const r=i%2===0?76:34;const x=652+Math.cos(a)*r,y=161+Math.sin(a)*r;if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);}ctx.closePath();
const e=ctx.createRadialGradient(635,130,5,652,161,85);e.addColorStop(0,'#ffe5a0');e.addColorStop(1,'#f0a84d');ctx.fillStyle=e;ctx.fill();
circulo(637,157,3,'#654d37');circulo(666,157,3,'#654d37');etiqueta('Estrella',652,274);
// Luna creciente creada con dos círculos superpuestos (recorte).
circulo(163,401,69,'#e8c976');ctx.save();ctx.globalCompositeOperation='destination-out';circulo(191,374,61,'#000');ctx.restore();
// Estrellas pequeñas de acompañamiento.
function brillo(x,y){linea(x-8,y,x+8,y,'#d5b65c',2);linea(x,y-8,x,y+8,'#d5b65c',2);}brillo(242,365);brillo(247,418);etiqueta('Luna',163,512);
// Figura libre: una tacita de café con vapor.
ctx.fillStyle='#d8a28d';ctx.beginPath();ctx.roundRect(352,392,115,78,12);ctx.fill();
ctx.beginPath();ctx.arc(466,423,24,-Math.PI/2,Math.PI/2);ctx.strokeStyle='#d8a28d';ctx.lineWidth=12;ctx.stroke();
ctx.fillStyle='#a9c2ae';ctx.fillRect(339,469,145,9);
for(const x of [377,410,443]){ctx.beginPath();ctx.moveTo(x,376);ctx.bezierCurveTo(x-17,360,x+14,348,x,329);ctx.strokeStyle='#9ca4a5';ctx.lineWidth=3;ctx.stroke();}
etiqueta('Taza de café',410,512);
// Figura libre adicional: una maceta con flor sencilla.
ctx.fillStyle='#b97d61';ctx.beginPath();ctx.moveTo(605,414);ctx.lineTo(700,414);ctx.lineTo(688,477);ctx.lineTo(619,477);ctx.closePath();ctx.fill();
linea(653,414,653,346,'#6b9b70',5);
ctx.fillStyle='#83b98c';ctx.beginPath();ctx.ellipse(633,388,22,10,Math.PI/6,0,Math.PI*2);ctx.fill();
for(let i=0;i<6;i++){const a=i*Math.PI/3;circulo(653+Math.cos(a)*20,338+Math.sin(a)*20,15,'#e9a6ad');}circulo(653,338,15,'#f0cb70');etiqueta('Flor en maceta',653,512);
</script></body></html>
